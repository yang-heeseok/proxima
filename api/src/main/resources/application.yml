# Application configuration.
#
# NOTHING HERE CARRIES A CREDENTIAL. Every value that could is an environment placeholder
# with no default, so that a missing variable fails at startup rather than falling back to
# something that happens to work on one machine. This repository is public and a pushed
# secret is compromised at push time, not at discovery time -- see PUB-1.
#
# NOTE ON open-in-view, WHICH IS NOW SET.
#
#   It was deliberately left unset -- and therefore ON -- until T1 measured what that cost.
#   It is now off, and R4 carries the numbers: at 200 VU, p99 9064 ms -> 5919 ms with the
#   pool unchanged at ten connections. With it on, 8 of those 10 connections were idle at
#   any instant while 189 requests queued for one.
#
#   TURNING IT OFF IS HALF OF THE FIX AND DOES NOT WORK ALONE. With it off, any lazy
#   association touched after the transaction raises LazyInitializationException. The other
#   half is proxima.recommendation.strategy=projection below, which is why both changed in
#   the same commit.
#
#   Measured, not assumed: switching only the strategy and leaving this ON changes nothing
#   at all -- the connection is held for the whole request whether or not anything lazy is
#   touched. R4 §3.2.
#
#   Setting it explicitly also silences Spring's startup warning. That warning is about not
#   having decided, not about the value: pinning it to `true` to quieten the log keeps the
#   behaviour and loses the notice.

spring:
  application:
    name: proxima

  datasource:
    url: ${PROXIMA_DB_URL}
    username: ${PROXIMA_DB_USER}
    password: ${PROXIMA_DB_PASSWORD}

  jpa:
    # See the note at the top of this file. Off, with the code that makes it survivable.
    open-in-view: false

    # The schema is owned by Flyway. Hibernate never creates or alters a table here --
    # ADR-002 depends on the migration sequence being the only thing that shapes the
    # database, because that sequence is the argument the repository is making.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator exposure is left at its default on purpose. T9 is a report about management
# endpoints exposed wholesale, including the one that dumps the heap; the state in which
# that is observable is created in that report's red commit, not here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
