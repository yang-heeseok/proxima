# Discharges PUB-1: the repository contains no secrets.
#
# This requirement cannot be satisfied retroactively, because history cannot be erased.
# The scanner runs inside the workflow rather than relying on a hosted feature, so that it
# keeps working if this repository is ever switched to private -- which is a stated
# possibility here (docs/decisions/publication-readiness.md §Public first, private later).
# Hosted secret scanning is oriented to public repositories; the period in which this
# repository is private is exactly the period a hosted feature would stop covering.
#
# Two lanes, with different jobs:
#   push / pull_request  -> prevention.    Blocks the secret from entering.
#   schedule             -> incident response. Finds what is already in history.
#
# WHAT TO DO WHEN THE SCHEDULED LANE FINDS SOMETHING.
#   The action is NOT deletion -- see above. The only remedy is ROTATING the credential.
#   After rotating, record the finding in .gitleaks.toml's ledger with its rotation date.
#   A finding that is not recorded means the credential has not been rotated yet.
#
#   This repository is public, so the clock is shorter than the usual advice assumes.
#   Public commits are harvested by automated scrapers within minutes. Rotate first and
#   record second; do not schedule the rotation.

name: secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prevention:
    name: scan incoming changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # NOTE: gitleaks-action is free for individual accounts and public repositories.
      # If this repository is moved under an organisation, OR switched to private under an
      # organisation, it requires a GITLEAKS_LICENSE secret. Verify that before either move.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  incident-response:
    name: scan full history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: remind what a finding means
        if: failure()
        run: |
          echo "A finding in history cannot be fixed by deleting it."
          echo "Rotate the credential NOW -- this repository is public."
          echo "Then record it in .gitleaks.toml's ledger with the rotation date."
          exit 1

  # A scanner that has never refused anything proves nothing about the trees it passed.
  #
  # THIS JOB EXISTS BECAUSE THE RULES IT TESTS WERE ONCE BROKEN AND LOOKED FINE.
  #
  #   On 2026-08-10 the custom rules in .gitleaks.toml were tested by planting secrets in
  #   a scratch directory. Two of the three planted secrets were missed. The rules matched
  #   only the flattened property form (`spring.datasource.password=`) and therefore
  #   matched nothing in nested YAML -- which is the form Spring configuration actually
  #   takes. The repository scan had been passing the whole time, because there was
  #   nothing to find.
  #
  #   Both a positive and a negative control are asserted here. A rule set that catches
  #   everything is as useless as one that catches nothing: the second half of this job
  #   plants values that MUST NOT be reported -- an environment interpolation, a
  #   fill-in-the-blank placeholder, and the throwaway credential Testcontainers uses --
  #   because a scanner that cries wolf gets its findings ignored, which is the same
  #   outcome as not scanning.
  config-self-test:
    name: the rules refuse a planted secret, and only that
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The planted values are GENERATED AT RUN TIME, not written in this file.
      #
      # The first version of this job embedded them as literals, and the working-tree scan
      # immediately reported this workflow -- correctly. The scanner cannot tell a fixture
      # from a leak, and it should not try.
      #
      # The available fixes were to allowlist this file, or to stop putting secrets in it.
      # Allowlisting would have exempted the one file in the repository whose whole purpose
      # is to contain secret-shaped text, which is a hole shaped exactly like the thing it
      # is meant to catch. Generating instead costs one line and leaves no literal behind.
      #
      # It also makes the test stronger: it is no longer checking that the rules recognise
      # four remembered strings.
      - name: positive control -- every planted secret is reported
        run: |
          set -eu
          work=$(mktemp -d)
          cp .gitleaks.toml "$work/.gitleaks.toml"

          gen() { openssl rand -base64 24 | tr -d '/+=' | head -c 20; }
          URL_PW=$(gen); DS_PW=$(gen); JWT=$(gen); PROP_PW=$(gen)

          cat > "$work/application-prod.yml" <<PLANTED
          spring:
            datasource:
              url: jdbc:postgresql://db.internal:5432/proxima?password=${URL_PW}
              password: ${DS_PW}
          jwt:
            secret: ${JWT}
          PLANTED

          cat > "$work/application.properties" <<PLANTED
          spring.datasource.password=${PROP_PW}
          PLANTED

          docker run --rm -v "$work:/w" ghcr.io/gitleaks/gitleaks:latest \
            dir /w --config=/w/.gitleaks.toml --redact \
            --report-format json --report-path /w/report.json >/dev/null 2>&1 || true

          count=$(python3 -c "import json;print(len(json.load(open('$work/report.json'))))")
          echo "planted 4 secrets, reported: $count"

          rules=$(python3 -c "import json;print(' '.join(sorted({f['RuleID'] for f in json.load(open('$work/report.json'))})))")
          echo "rules that fired: $rules"
          rm -rf "$work"

          # Four secrets planted: a password inside a JDBC URL, a password in nested YAML,
          # a signing key in nested YAML, and a password in flattened property form.
          if [ "$count" -lt 4 ]; then
            echo ""
            echo "FAIL: the rule set let a planted secret through."
            echo "This is exactly how the rules were broken on 2026-08-10 -- they passed"
            echo "the repository scan while matching nothing in the config format the"
            echo "project uses. Fix the rule, do not lower this threshold."
            exit 1
          fi
          echo "OK: every planted secret was reported."

      - name: negative control -- a non-secret is not reported
        run: |
          set -eu
          work=$(mktemp -d)
          cp .gitleaks.toml "$work/.gitleaks.toml"

          cat > "$work/application-test.yml" <<'NOTSECRET'
          spring:
            datasource:
              password: postgres
            security:
              client-secret: ${PROXIMA_CLIENT_SECRET}
          auth-token: <your-token-here>
          api:
            secret: xxxxxxxxxxxx
          NOTSECRET

          docker run --rm -v "$work:/w" ghcr.io/gitleaks/gitleaks:latest \
            dir /w --config=/w/.gitleaks.toml --redact \
            --report-format json --report-path /w/report.json >/dev/null 2>&1 || true

          count=$(python3 -c "import json;print(len(json.load(open('$work/report.json'))))")
          echo "planted 4 non-secrets, reported: $count"
          if [ "$count" -ne 0 ]; then
            python3 -c "import json;[print(' ',f['RuleID'],'->',f['File']) for f in json.load(open('$work/report.json'))]"
            rm -rf "$work"
            echo ""
            echo "FAIL: the rule set reported something that is not a secret."
            echo "An environment interpolation, a placeholder, and a Testcontainers default"
            echo "must all pass. Findings that are routinely wrong are findings nobody reads."
            exit 1
          fi
          rm -rf "$work"
          echo "OK: nothing was reported that should not have been."
