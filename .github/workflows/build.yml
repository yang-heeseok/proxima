# The test lane.
#
# WHY THIS EXISTS, AND WHY IT DID NOT EXIST UNTIL NOW.
#
#   Until T3 there was nothing for it to protect: the repository held documents, guards, a
#   schema, and a generator with its own tests. Adding a CI lane before there was code to
#   break is the kind of unbanked infrastructure AGENTS.md Scope warns about.
#
#   T3 changed the condition. Its regression gate is a set of ArchUnit rules, and a rule
#   that nothing runs is a comment. The gate and the lane that runs it arrive together.
#
# WHAT THIS LANE MAY NOT BECOME.
#
#   It reports pass or fail. It does NOT publish numbers: a measurement taken on a shared
#   runner of unstated size is not comparable to one taken on the machine in
#   measurement-discipline.md, and this repository's product is comparable numbers.
#
#   `OPEN-5` is closed by `ADR-004`, and the useful part of closing it was finding that the
#   rule had been leaking the other way round. `R9` §3.6 quoted this lane's own step timing
#   in a report and divided it by a figure from a developer machine. So the decision has two
#   halves: this lane states its environment per run (the step below), and a report that
#   quotes a number from it carries that block and the run id. Assertions here stay
#   machine-independent -- counts, statuses, exact row totals -- and those are safe anywhere.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: gradlew test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The toolchain version is NOT repeated here. gradle.properties owns it, and Gradle
      # resolves the toolchain itself -- a version pinned in two places is a version that
      # will disagree with itself. This step only has to provide a JDK new enough to run
      # Gradle; the build then selects the toolchain it was told to.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Testcontainers needs a Docker daemon. GitHub's ubuntu runners provide one; this
      # step fails loudly if that ever stops being true, rather than letting the test lane
      # fail with a confusing connection error deep inside a Spring context.
      - name: docker is reachable
        run: |
          set -eu
          docker version --format 'server {{.Server.Version}}'

      # THE ENVIRONMENT THIS RUN'S NUMBERS WOULD BELONG TO. ADR-004, closing OPEN-5.
      #
      #   This lane still does not publish measurements. What changed is the other
      #   direction: a REPORT quoted a number from a CI run -- R9 §3.6 took the "api tests"
      #   step's 65 s off the workflow API and set it beside a container-start figure measured
      #   on a developer machine. OPEN-5 was written to stop CI publishing numbers and had
      #   nothing to say about that, and measurement-discipline rule 3 -- before and after
      #   come from the same run conditions -- was broken without anyone noticing.
      #
      #   A number that escapes from here now has somewhere to point. This step costs a
      #   second and makes every run self-describing, which is the difference between a
      #   citable figure and a remembered one.
      - name: the environment any number from this run belongs to
        run: |
          set -eu
          echo "run           : ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}"
          echo "runner image  : ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH})"
          echo "kernel        : $(uname -sr)"
          echo "cpu           : $(nproc) x $(sed -n 's/^model name[ \t]*: //p' /proc/cpuinfo | head -1)"
          echo "memory        : $(free -m | awk '/^Mem:/ {printf "%.1f GiB", $2/1024}')"
          echo "disk (workdir): $(df -h . | awk 'NR==2 {print $2" total, "$4" free"}')"
          echo "docker        : $(docker version --format '{{.Server.Version}}')"
          echo "java          : $(java -version 2>&1 | head -1)"

      # SPLIT ON PURPOSE, AND THE REASON IS WORTH KEEPING.
      #
      #   The first failure of this lane could not be diagnosed. Workflow logs need an
      #   authenticated token to read through the API, the artifact upload needs one too,
      #   and the run had produced no test-results to upload in the first place -- so the
      #   only fact available was "the test step failed", which was consistent with a
      #   compile error, a missing Docker daemon, and a genuine test failure alike.
      #
      #   Step CONCLUSIONS are readable without a token. Splitting one step into four turns
      #   an opaque failure into a located one, without needing to read anything. The order
      #   is cheapest-and-least-dependent first, so the first red step names the layer.
      #
      #   This is the lane telling the truth about itself, which is the same standard the
      #   guards in the other workflows are held to.

      # The step that would have named the first failure of this lane immediately.
      #
      #   `gradlew` was committed from a Windows checkout as mode 100644. Every local run
      #   was green because the working tree lives on a drvfs mount, which reports every
      #   file as 0777 no matter what git records -- so the missing executable bit was
      #   invisible on the machine that created it and fatal on every clean clone.
      #
      #   Without this step the failure lands on "compile", which is exactly the wrong
      #   place to look: Gradle had not started.
      - name: the wrapper is executable and runs
        run: ./gradlew --version --no-daemon

      - name: compile, including test sources
        run: ./gradlew testClasses --no-daemon --console=plain --stacktrace

      - name: seed tests — pure JVM, no database
        run: ./gradlew :seed:test --no-daemon --console=plain --stacktrace

      - name: architecture rules — bytecode only, no database
        run: >
          ./gradlew :api:test --no-daemon --console=plain --stacktrace
          --tests "net.gseek.proxima.arch.*"

      - name: api tests — Testcontainers, real PostgreSQL
        run: ./gradlew :api:test --no-daemon --console=plain --stacktrace

      # Uploaded for a person to read, since the API route needs a token. `warn` rather
      # than the default so that a run which failed BEFORE producing any results still
      # completes this step instead of failing here and hiding the original cause.
      - name: publish whatever the run produced
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            api/build/reports/tests/
            api/build/test-results/
            seed/build/reports/tests/
            seed/build/test-results/
          retention-days: 7
