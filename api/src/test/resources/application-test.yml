# Test configuration.
#
# WHY THESE THREE VALUES EXIST AT ALL.
#
#   The main application.yml names its datasource with strict placeholders and no
#   defaults, so that a missing environment variable fails at startup instead of silently
#   falling back to something that happens to work on one machine. That is the right
#   behaviour for a deployment and it makes the placeholders unresolvable in a test.
#
#   These values satisfy the placeholder, and nothing more. @ServiceConnection registers
#   the container's real connection details as a bean, and a ConnectionDetails bean takes
#   precedence over every spring.datasource.* property -- so none of the values below is
#   ever dialled. They are deliberately shaped to say so out loud, because a plausible
#   looking localhost URL here would be a trap for the next person debugging a connection
#   failure.

spring:
  datasource:
    url: jdbc:postgresql://never-dialled.invalid:1/replaced-by-serviceconnection
    username: replaced-by-serviceconnection
    password: replaced-by-serviceconnection

  # Statement counting for T7, on in tests and off in production.
  #
  # (proxima.security.token-secret is below, outside the `spring` block.)
  #
  #   Hibernate keeps these counters only when asked, and asking costs a little on every
  #   statement. That is a fine price for a test lane and not one to pay on every request
  #   in production for a number nobody reads there -- so it lives in the profile that only
  #   tests activate, and StatementCounter fails loudly if it is ever missing.
  jpa:
    properties:
      hibernate:
        generate_statistics: true

# THE SIGNING KEY THE TESTS USE.
#
#   application.yml names this with a strict ${PROXIMA_TOKEN_SECRET} placeholder and no
#   default, so a test has to supply one or nothing starts. This value is not a credential:
#   it signs tokens for an application that is not deployed anywhere, and every token it
#   signs is thrown away when the JVM exits.
#
#   It lives HERE and not in a Kotlin test source on purpose. `.gitleaks.toml` allowlists
#   `src/test/resources/**` by path, with the same reasoning it applies to Testcontainers'
#   throwaway database credentials -- a test whose credentials are hidden is a test nobody
#   else can run. A literal in a test .kt file would sit outside that allowlist and would
#   deserve to be flagged. Tests read this back through the Spring environment.
#
#   The scanner's rule was NOT relaxed to admit it. PUB-1.
proxima:
  security:
    token-secret: test-profile-signing-key-not-a-credential
