# Application configuration.
#
# NOTHING HERE CARRIES A CREDENTIAL. Every value that could is an environment placeholder
# with no default, so that a missing variable fails at startup rather than falling back to
# something that happens to work on one machine. This repository is public and a pushed
# secret is compromised at push time, not at discovery time -- see PUB-1.
#
# NOTE ON open-in-view, WHICH IS NOW SET.
#
#   It was deliberately left unset -- and therefore ON -- until T1 measured what that cost.
#   It is now off, and R4 carries the numbers: at 200 VU, p99 9064 ms -> 5919 ms with the
#   pool unchanged at ten connections. With it on, 8 of those 10 connections were idle at
#   any instant while 189 requests queued for one.
#
#   TURNING IT OFF IS HALF OF THE FIX AND DOES NOT WORK ALONE. With it off, any lazy
#   association touched after the transaction raises LazyInitializationException. The other
#   half is proxima.recommendation.strategy=projection below, which is why both changed in
#   the same commit.
#
#   Measured, not assumed: switching only the strategy and leaving this ON changes nothing
#   at all -- the connection is held for the whole request whether or not anything lazy is
#   touched. R4 §3.2.
#
#   Setting it explicitly also silences Spring's startup warning. That warning is about not
#   having decided, not about the value: pinning it to `true` to quieten the log keeps the
#   behaviour and loses the notice.

spring:
  application:
    name: proxima

  datasource:
    url: ${PROXIMA_DB_URL}
    username: ${PROXIMA_DB_USER}
    password: ${PROXIMA_DB_PASSWORD}

  jpa:
    # See the note at the top of this file. Off, with the code that makes it survivable.
    open-in-view: false

    # The schema is owned by Flyway. Hibernate never creates or alters a table here --
    # ADR-002 depends on the migration sequence being the only thing that shapes the
    # database, because that sequence is the argument the repository is making.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# WHAT THIS LIST IS, MEASURED. docs/reports/R10.
#
#   An earlier version of this comment said the exposure was "left at its default" and that
#   the wide-open state would arrive in T9's red commit. Both halves were wrong. The default
#   is `health` alone, so this list is already a decision; and R10 §5 declined to commit a
#   wide-open surface at all -- a public repository carrying one in its history is a worked
#   example for the wrong reader, and the finding reproduces from a test property.
#
#   Measured with the surface opened to "*": the index returned THIRTEEN ids. R10 §3.1 owns
#   that list and the statuses beside it -- this comment points at it rather than restating a
#   number it cannot keep current. Among them are `env`, `configprops`, `beans`, `mappings`,
#   `threaddump` and `loggers` -- and `loggers` is not a view but a control surface
#   (POST -> 204, level null -> TRACE). `heapdump` stays 404 because exposure and access are
#   separate gates and its access defaults to `none`; opened, it returns 156 MB containing the
#   datasource password that `env` masks. `shutdown` is the OTHER endpoint whose access
#   defaults to `none` on this version -- two of fifteen, R10 §3.2.
#
#   THIS COMMENT SAID "twelve of thirteen endpoints answer" UNTIL 2026-08-22, and no run ever
#   measured that. R10 §3.1 lists thirteen ids and probed six of them at 200; `heapdump` is not
#   among the thirteen, so the sentence was not "thirteen minus heapdump" either. The twelve
#   came from R10 §3.4 -- "the other twelve ... answer QUESTIONS", meaning the thirteen minus
#   `loggers`, which takes instructions instead. Both categories answer. A view-versus-control
#   split was copied out as an answer-versus-no-answer count, and this comment then listed
#   `loggers` INSIDE the twelve it had been excluded from, which is the tell.
#
#   `prometheus` was in this list and is gone. It was measured at 404 even with exposure set
#   to "*", so this build has no such endpoint and the line had never done anything. R10 §3.6.
#
# ManagementSurfaceGateTest asserts this over HTTP rather than reading the list back.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# WHY THERE IS A TOKEN HERE AT ALL, AND WHAT IT IS NOT.
#
#   T9 needs a request that can be attributed to somebody: two of its three strands are about
#   the gap between verifying a caller and deciding what that caller may reach, and neither
#   exists without authentication. RequestToken is the smallest thing that produces the gap.
#   It is a MEASUREMENT FIXTURE -- no rotation, no revocation, no issuer, no login. Read its
#   KDoc before borrowing any of it.
#
#   The secret is a strict placeholder with no default, for the same reason the datasource
#   ones are: a missing environment variable should fail at startup rather than fall back to
#   something that happens to work on one machine. The test profile supplies its own.
proxima:
  # HOW ONE RECORDING MOVES A MASTERY ROW. docs/reports/R12.
  #
  #   read-modify-write  read the row, mutate it, save it -- R6's `entity + @Version` arm,
  #                      which kept 180 of 1,000 increments and rejected 820, with R7's
  #                      check-then-insert on top of it. `red`.
  #   atomic-guarded     R7's `on conflict do nothing`, then R6's single statement with the
  #                      0..1 business rule carried as a WHERE predicate rather than as a
  #                      constraint -- so a rejected recording matches no row instead of
  #                      aborting the transaction (R1 §9).
  recording:
    mastery-update: atomic-guarded

    # WHAT A BATCH DOES WHEN ONE RECORDING IN IT IS REJECTED. docs/reports/R14.
    #
    #   stop-at-first-failure  the rejection propagates and everything after it is never
    #                          attempted. The caller is told that something failed and not
    #                          what landed. `red` -- and it is what shipped from 21e7162.
    #   per-item-outcomes      every recording is attempted and its result returned.
    #
    #   The per-recording transaction is unchanged either way. AttemptRecorder.record is
    #   still the unit of work and a rejected recording still leaves nothing behind.
    batch: per-item-outcomes

  security:
    token-secret: ${PROXIMA_TOKEN_SECRET}

    # Which arm of T9's strands ships. Both defaults are the `green` ones; the `red` arms
    # exist so the red state stays runnable in one binary -- R4 §2's argument.
    #
    #   authorisation:  none   the path names the learner and the verified caller is ignored
    #                   owner  the path must name the caller, or 403
    #
    #   expiry-policy:  ignored  the signature is checked and the timestamps are not
    #                   strict   expired and not-yet-valid rejected, zero tolerance
    #                   skewed   the same, with skew-tolerance-seconds of leeway
    authorisation: owner
    expiry-policy: skewed
    skew-tolerance-seconds: 30
