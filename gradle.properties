# Build properties.
#
# THE TOOLCHAIN VERSION IS PINNED HERE AND NOWHERE ELSE.
#
#   A measurement taken on one JVM and compared against a measurement taken on another is
#   not a comparison -- see docs/explanation/measurement-discipline.md, rule 3. The JDK
#   this project builds and runs on is therefore a property of the repository, not of
#   whoever is sitting in front of it: Gradle resolves the toolchain itself and ignores
#   JAVA_HOME. CI reads this same file.
#
#   The exact build in use when this was pinned is recorded in the measurement environment
#   block, because "21" is not precise enough to reproduce a number with.
#
#   Chosen in docs/decisions/adr/ADR-000-spring-boot-line.md.
javaToolchainVersion=21

# Dependency versions. Kept here so that a version appears once and a reader can see the
# whole set at a glance -- ADR-000 (Spring Boot line) and ADR-001 (QueryDSL) both point at
# specific numbers, and a version drifting away from its ADR silently is the failure this
# guards against.
springBootVersion=4.1.0
springDependencyManagementVersion=1.1.7
kotlinVersion=2.3.21
querydslVersion=7.0

# seed/ has no Spring dependency management to inherit a test engine version from, so it
# states one. This is the version the api module's Boot BOM actually resolves to -- read
# off testRuntimeClasspath, not chosen -- so both modules run the same engine.
junitVersion=6.0.3

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
