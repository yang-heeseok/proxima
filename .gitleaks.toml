# gitleaks configuration.
#
# Discharges PUB-1: the repository contains no secrets.
#
# ROTATION LEDGER
# ---------------
# History cannot be erased, so a secret found in history is not removed -- the credential
# is rotated, and the finding is recorded with the date it was rotated.
#
# The rule that makes this observable rather than aspirational:
#
#     A finding that is NOT recorded has not been rotated.
#
# That keeps every alert from the scheduled full-history scan actionable. Recording
# happens in .gitleaksignore, one fingerprint per rotated finding, each preceded by a
# comment line naming what leaked, the rotation date, and who rotated:
#
#     # <what leaked> | rotated <YYYY-MM-DD> by <who>
#     <commit>:<file>:<rule-id>:<line>
#
# A fingerprint names exactly one finding. A commit allowlist is deliberately NOT used:
# a commit SHA there exempts EVERY finding in that commit, which is wider than any
# rotation ever is. Do not record a finding you have not actually rotated -- that
# converts the one guard PUB-1 has into a comment.
#
# THIS REPOSITORY IS PUBLIC. That makes the scheduled lane's finding an incident rather
# than a warning: a credential in a public commit must be assumed harvested within
# minutes, so rotation is immediate and is not scheduled for later.

[extend]
useDefault = true

# This project's likely credential set is named explicitly so that a new module cannot
# introduce a key class nothing scans for. The default rule set covers the major cloud
# providers; what follows covers the shapes this repository will actually grow.

[[rules]]
id = "proxima-jdbc-url-with-password"
description = "JDBC connection string carrying an inline password"
regex = '''jdbc:(?:postgresql|mysql)://[^\s'"]*[?&](?:password|pwd)=([^\s&'"]{6,})'''
secretGroup = 1
keywords = ["jdbc:postgresql", "jdbc:mysql"]

# A secret assigned to a configuration key, in EITHER form Spring accepts.
#
# THIS RULE REPLACED TWO EARLIER ONES THAT DID NOT WORK, AND THE REASON IS WORTH KEEPING.
#
#   The originals matched the flattened property form only:
#
#       spring.datasource.password=...        matched
#       jwt.secret=...                        matched
#
#   Which meant they matched nothing in the format Spring projects actually use:
#
#       spring:                               NOT matched
#         datasource:
#           password: ...                     <- the key on this line is just "password"
#
#   A planted secret in nested YAML went straight through. It was caught only by the
#   default generic-api-key rule, by luck of being long and high-entropy -- a shorter
#   password would have been missed entirely.
#
#   The fix is the `[\w.\-]*` prefix: the key may be dotted, underscored, or bare, so the
#   nested form and the flattened form are the same rule.
#
# This rule was found to be broken by planting a secret and watching the scanner not
# refuse it. That is the only way any of this is ever established.
[[rules]]
id = "proxima-config-secret-assignment"
description = "Password, secret, or signing key assigned to a configuration key -- nested YAML or flattened property"
regex = '''(?im)^[ \t]*[\w.\-]*(?:password|passwd|pwd|secret|signing[_-]?key|client[_-]?secret|auth[_-]?token)\s*[:=]\s*['"]?([^\s'"#]{8,})['"]?[ \t]*$'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "pwd", "secret", "signing", "token"]

[allowlist]
description = "Material that names a credential without holding one"
paths = [
  '''\.env\.example$''',
  '''(^|/)docs/.*\.md$''',
  '''(^|/)\.gitleaks\.toml$''',
  # Testcontainers supplies throwaway credentials for a container that lives for the
  # duration of one test run and is never reachable from outside the runner. They are
  # deliberately in the tree, because a test whose credentials are hidden is a test
  # nobody else can run.
  '''(^|/)src/test/resources/.*''',
]
# ANCHORED, AND THE ANCHORING IS THE POINT.
#
# These were substring matches. A secret is exempted when it MATCHES one of these, and a
# substring match meant any secret that happened to contain "example" or "placeholder"
# anywhere inside it was exempted -- including, in the self-test that found this, a
# deliberately planted one named `s3cr3t-not-a-placeholder-value`.
#
# An allowlist that can be defeated by naming a variable well is not an allowlist.
regexes = [
  # Environment interpolation: the config names a secret it does not hold.
  '''^\$\{[A-Za-z0-9_.]+\}$''',
  '''^\$[A-Za-z_][A-Za-z0-9_]*$''',
  # Obvious fill-in-the-blank shapes, matched WHOLE.
  '''(?i)^(?:x{4,}|<[a-z0-9_-]+>|your[_-]?[a-z0-9_-]+|(?:example|sample|placeholder|redacted|dummy|changeme|todo)[a-z0-9_-]*)$''',
  # The literal values Testcontainers' PostgreSQL module defaults to, and nothing that
  # merely contains them.
  '''^(?:test|postgres|password)$''',
]
